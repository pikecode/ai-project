    - generic [ref=f1e33]: "# 澄星演示公司报销操作说明 文件名：01-报销操作说明.md 版本：1.1 片段：1/1 # 澄星演示公司报销操作说明 > 虚构演示资料，仅用于助手测试，不是任何真实公司的制度。 资料编号：DEMO-EXP-001 版本：1.1 生效日期：2026-10-01 状态：本演示场景有效 适用范围：澄星演示公司日常办公费用；不适用于采购合同或差旅补贴。 ## 提交材料与入口 申请人在“演示办公台 → 费用 → 新建报销”提交电子发票、付款凭证及费用用途说明。材料不全时，财务退回并注明缺失项；申请人补齐后重新提交。 ## 审批与付款 费用不超过 800 元（含 800 元），由部门负责人审批；超过 800 元，先由部门负责人审批，再由财务负责人审批。财务审核通过后，在 5 个工作日内付款；补充材料所用时间不计入该期限。 审批级别按每笔申请的总金额判断。超过 800 元时，整笔申请经过上述两级审批，不是只审批超出的部分。800 元是审批分级界限，不是本文规定的报销金额上限。 ## 缺失信息 本说明没有规定每月报销总额度，也没有说明逾期提交期限。不能据此推断没有额度限制或没有期限限制。差旅住宿标准见 DEMO-TRAVEL-001。"
